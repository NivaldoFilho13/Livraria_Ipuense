<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Encomendar livro · E10 Livraria</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topo">
      <div class="topo-container">
        <a href="index.html" class="marca"
          >📚
          <span>E10 Livraria <small>&amp; Papelaria Ipuense</small></span></a
        >
        <nav class="menu-principal">
          <a href="index.html">Catálogo</a
          ><a href="meus-pedidos.html">Meus pedidos</a>
        </nav>
      </div>
    </header>
    <main class="conteudo">
      <h1>Encomendar um livro</h1>
      <p>
        Não encontrou o que procura? Solicite abaixo e a equipe entrará em
        contato com prazo e valor.
      </p>
      <div class="form-caixa">
        <form data-demo-message="Encomenda registrada na demonstração.">
          <div class="campo">
            <label for="titulo">Título do livro</label
            ><input id="titulo" required />
          </div>
          <div class="campo">
            <label for="autor">Autor (se souber)</label><input id="autor" />
          </div>
          <div class="campo">
            <label for="editora">Editora (se souber)</label
            ><input id="editora" />
          </div>
          <div class="campo">
            <label for="observacoes">Observações</label
            ><textarea
              id="observacoes"
              placeholder="Edição específica, prazo desejado, etc."
            ></textarea>
          </div>
          <button class="btn btn-primario" style="width: 100%">
            Solicitar encomenda
          </button>
        </form>
        <p class="aviso-demo">
          Para encomendas reais, use o botão de WhatsApp no canto da tela.
        </p>
      </div>
    </main>
    <footer class="rodape">
      <p class="copy">© 2026 E10 Livraria &amp; Papelaria Ipuense.</p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
